name: Deploy VitalSync to GitHub Pages

on:
  # Läuft bei jedem Push auf JEDEN Branch. Grund: Dieses Repository nutzt
  # nicht zwingend "main" als Standard-Branch – mit einer festen Branch-Liste
  # würde der Deploy sonst stillschweigend nie starten.
  push:
    branches: ["**"]
  # Zusätzlich manuell startbar über den Tab "Actions" -> "Run workflow".
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      # VITE_BASE_PATH wird automatisch aus dem Repo-Namen gebildet, damit
      # die App unabhängig davon, wie das Repo heißt, unter
      # https://<user>.github.io/<repo>/ korrekt funktioniert.
      # GITHUB_REPOSITORY hat die Form "besitzer/repo"; "${VAR#*/}" schneidet
      # alles bis zum ersten "/" ab und lässt den reinen Repo-Namen übrig.
      - name: Build
        run: |
          export VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          echo "Base-Pfad für den Build: $VITE_BASE_PATH"
          npm run build

      # enablement: true schaltet GitHub Pages bei Bedarf selbst ein (nutzt die
      # pages:write-Berechtigung oben). Ohne diese Zeile bricht der Workflow mit
      # "Get Pages site failed" ab, solange Pages nicht von Hand unter
      # Settings -> Pages auf "GitHub Actions" gestellt wurde.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
